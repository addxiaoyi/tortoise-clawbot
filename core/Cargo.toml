[package]
name = "tortoise-core"
version = "0.1.0"
edition = "2021"
authors = ["Tortoise Team"]
description = "High-performance AI Agent runtime core"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"

# Networking
tokio-tungstenite = "0.21"
tokio-native-tls = "0.3"
hyper = { version = "1.2", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"

# Memory & Storage
sled = "0.34"
tempfile = "3.9"

# Crypto
ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# Compression
zstd = "0.13"
lz4 = "1.24"

# Async traits
async-trait = "0.1"

# Futures
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
