apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tortoise-ingress
  namespace: tortoise
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-write-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tortoise.ai
        - app.tortoise.ai
      secretName: tortoise-tls
  rules:
    - host: api.tortoise.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tortoise-svc
                port:
                  number: 18792
    - host: app.tortoise.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tortoise-web-svc
                port:
                  number: 3000
