name: tortoise_ui
description: Tortoise Flutter UI - Cross-platform AI agent interface
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Networking
  web_socket_channel: ^2.4.0
  dio: ^5.3.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  path_provider: ^2.1.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1

  # Theme
  flex_color_scheme: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: TortoiseIcons
      fonts:
        - asset: assets/fonts/TortoiseIcons.ttf
