name: tortoise_ui
description: Tortoise AI Agent Framework - Flutter UI
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  go_router: ^13.0.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  intl: ^0.18.1
  uuid: ^4.2.2
  flutter_secure_storage: ^9.0.0
  window_manager: ^0.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true
