name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  # ========== Go 后端测试 ==========
  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: server/coverage.out

      - name: Build
        run: go build -o tortoise-server .

  # ========== Flutter 前端测试 ==========
  test-flutter:
    name: Test Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.NODE_VERSION }}
          channel: stable

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/bin/cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter/coverage/

  # ========== Docker 构建 ==========
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-server
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: tortoise/server:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test Docker image
        run: |
          docker run --rm tortoise/server:test --help || true

  # ========== 安全扫描 ==========
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Go vulnerability check
        uses: TrailofBits/checksec-action@v1
        with:
          tool: govulncheck
          args: -format json ./...

      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt json -out gosec-results.json ./...

  # ========== 代码质量检查 ==========
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not properly formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run linter
        run: |
          go install golang.org/x/tools/cmd/staticcheck@latest
          staticcheck ./...

  # ========== 多平台构建 ==========
  build-multiplatform:
    name: Build Multiplatform
    runs-on: ubuntu-latest
    needs: test-server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ split(matrix.platform, '/')[0] }}
          GOARCH: ${{ split(matrix.platform, '/')[1] }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          CGO_ENABLED=0 go build -ldflags="-s -w" -o tortoise-${{ matrix.platform }}$EXT .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tortoise-${{ matrix.platform }}
          path: tortoise-*

  # ========== 发布 ==========
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-multiplatform, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Generate checksums
        run: |
          cd releases
          for f in tortoise-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: releases/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
