name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # === Create Release ===
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            CHANGELOG.md
            LICENSE
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # === Build Binaries ===
  build-rust:
    name: Build Rust Binary
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: tortoise-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tortoise-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tortoise-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --bin tortoise --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/tortoise ${{ matrix.artifact }}

      - name: Upload Artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: application/octet-stream

  # === Build Docker ===
  docker:
    name: Build Docker
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tortoise/tortoise:${{ steps.version.outputs.VERSION }}
            tortoise/tortoise:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === Build Flutter ===
  flutter:
    name: Build Flutter App
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16'

      - name: Build Android APK
        working-directory: ui
        run: flutter build apk --release

      - name: Build iOS (macOS only)
        if: runner.os == 'macOS'
        working-directory: ui
        run: flutter build ios --release --no-codesign

      - name: Upload APK
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./ui/build/app/outputs/flutter-apk/app-release.apk
          asset_name: tortoise-android.apk
          asset_content_type: application/vnd.android.package-archive

  # === Publish NPM ===
  npm:
    name: Publish NPM
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        working-directory: npm
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
