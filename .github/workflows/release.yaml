name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${tag#v}" >> $GITHUB_OUTPUT
        env:
          tag: ${{ github.ref_name }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Tortoise ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') }}

  # Build and release Rust Core
  release-rust:
    name: Release Rust Core
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: 0

      - name: Package
        shell: bash
        run: |
          cd core/target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            zip tortoise-core-${{ matrix.target }}.zip tortoise-core.exe
            echo "ASSET=core/target/${{ matrix.target }}/release/tortoise-core-${{ matrix.target }}.zip" >> $GITHUB_OUTPUT
          else
            tar czf tortoise-core-${{ matrix.target }}.tar.gz tortoise-core
            echo "ASSET=core/target/${{ matrix.target }}/release/tortoise-core-${{ matrix.target }}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and release Go Server
  release-go:
    name: Release Go Server
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd server
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/tortoise-server-$GOOS-$GOARCH$ext ./cmd/gateway

      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd server/dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          if [ "$GOOS" = "linux" ]; then
            tar czf tortoise-server-$GOOS-$GOARCH.tar.gz tortoise-server-$GOOS-$GOARCH$ext
            echo "ASSET=server/dist/tortoise-server-$GOOS-$GOARCH.tar.gz" >> $GITHUB_OUTPUT
          else
            zip tortoise-server-$GOOS-$GOARCH.zip tortoise-server-$GOOS-$GOARCH$ext
            echo "ASSET=server/dist/tortoise-server-$GOOS-$GOARCH.zip" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish npm packages
  release-npm:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish Python packages
  release-python:
    name: Publish Python Packages
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish Python SDK
        working-directory: sdk/python
        run: |
          pip install build twine
          python -m build
          python -m twine upload --repository pypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # Release Docker images
  release-docker:
    name: Release Docker Images
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${tag#v}" >> $GITHUB_OUTPUT
        env:
          tag: ${{ github.ref_name }}

      - name: Build and push core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.core
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/core:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}/core:latest

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}/server:latest

  # Publish Helm chart
  release-helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Package Helm chart
        run: |
          mkdir -p charts
          helm package k8s/ -d charts

      - name: Update index
        run: |
          helm repo index charts --url https://github.com/${{ github.repository }}/releases/download/helm-${{ github.ref_name }}

      - name: Commit and push
        run: |
          git add charts/
          git commit -m "Release Helm chart ${{ github.ref_name }}"
          git push
