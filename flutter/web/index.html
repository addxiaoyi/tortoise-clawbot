<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0D9488">
  <meta name="description" content="Tortoise - 下一代 AI 代理框架">
  <title>Tortoise - AI Agent Framework</title>
  
  <!-- PWA Support -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Loading styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0D9488 0%, #0F766E 50%, #115E59 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
    }
    
    .loading-container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }
    
    .logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .tagline {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 40px;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 1rem;
      opacity: 0.8;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 50px;
      text-align: left;
    }
    
    .feature {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.3s ease;
    }
    
    .feature:hover {
      transform: translateY(-5px);
    }
    
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .feature h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }
    
    .feature p {
      font-size: 0.85rem;
      opacity: 0.8;
    }
    
    .desktop-notice {
      position: fixed;
      bottom: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 0.9rem;
    }
    
    @media (max-width: 600px) {
      .features {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .tagline {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <!-- Logo SVG -->
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F59E0B"/>
            <stop offset="100%" style="stop-color:#D97706"/>
          </linearGradient>
        </defs>
        <!-- Tortoise Shell -->
        <ellipse cx="50" cy="55" rx="40" ry="30" fill="url(#grad)"/>
        <!-- Shell Pattern -->
        <path d="M25 55 Q50 35 75 55 Q50 75 25 55" fill="none" stroke="#92400E" stroke-width="2"/>
        <path d="M30 45 Q50 30 70 45" fill="none" stroke="#92400E" stroke-width="1.5"/>
        <path d="M30 65 Q50 80 70 65" fill="none" stroke="#92400E" stroke-width="1.5"/>
        <!-- Head -->
        <ellipse cx="85" cy="50" rx="12" ry="8" fill="#059669"/>
        <!-- Eye -->
        <circle cx="90" cy="48" r="2" fill="#1F2937"/>
        <!-- Legs -->
        <ellipse cx="25" cy="70" rx="8" ry="5" fill="#059669"/>
        <ellipse cx="75" cy="70" rx="8" ry="5" fill="#059669"/>
        <ellipse cx="30" cy="35" rx="6" ry="4" fill="#059669"/>
        <ellipse cx="70" cy="35" rx="6" ry="4" fill="#059669"/>
        <!-- Tail -->
        <path d="M15 55 Q10 55 8 60" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    
    <h1>Tortoise</h1>
    <p class="tagline">下一代 AI 代理框架</p>
    
    <div class="loading-spinner"></div>
    <p class="loading-text">正在启动应用...</p>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <h3>多模型支持</h3>
        <p>OpenAI, Claude, Gemini 等</p>
      </div>
      <div class="feature">
        <div class="feature-icon">💬</div>
        <h3>多渠道接入</h3>
        <p>Telegram, Discord, Slack 等</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🧠</div>
        <h3>智能记忆</h3>
        <p>语义搜索，长期记忆</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🔌</div>
        <h3>插件系统</h3>
        <p>无限扩展功能</p>
      </div>
    </div>
    
    <p class="desktop-notice">
      💡 推荐使用桌面端或移动设备获得最佳体验
    </p>
  </div>
  
  <script>
    // Redirect to Flutter app when ready
    window.addEventListener('flutter-first-frame', function() {
      // App is loaded, Flutter will take over
    });
    
    // Fallback: if Flutter doesn't load in 10 seconds, show message
    setTimeout(function() {
      const spinner = document.querySelector('.loading-spinner');
      const text = document.querySelector('.loading-text');
      if (spinner) {
        spinner.style.display = 'none';
      }
      if (text) {
        text.textContent = 'Flutter Web 运行时未检测到';
      }
    }, 10000);
  </script>
  
  <!-- Flutter App Loader -->
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
