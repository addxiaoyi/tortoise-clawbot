# Tortoise Framework Helm Chart

## Installation

```bash
# Add repository
helm repo add tortoise https://charts.tortoise.ai
helm repo update

# Install
helm install tortoise tortoise/tortoise \
  --set gateway.replicas=2 \
  --set cloud.replicas=2
```

## Configuration

| Parameter | Description | Default |
|-----------|-------------|---------|
| `gateway.replicas` | Number of gateway replicas | 1 |
| `gateway.image.repository` | Gateway image | tortoise/gateway |
| `gateway.image.tag` | Gateway tag | 0.1.0 |
| `gateway.service.type` | Gateway service type | ClusterIP |
| `gateway.service.port` | Gateway service port | 8080 |
| `gateway.resources.limits.cpu` | CPU limit | 1000m |
| `gateway.resources.limits.memory` | Memory limit | 512Mi |
| `cloud.replicas` | Number of cloud replicas | 1 |
| `cloud.image.repository` | Cloud image | tortoise/cloud |
| `cloud.image.tag` | Cloud tag | 0.1.0 |
| `cloud.service.type` | Cloud service type | ClusterIP |
| `cloud.service.port` | Cloud service port | 8081 |
| `postgresql.enabled` | Enable PostgreSQL | true |
| `redis.enabled` | Enable Redis | true |

## Values.yaml

```yaml
# Default values for Tortoise chart

replicaCount: 1

image:
  repository: tortoise
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Gateway specific
gateway:
  replicas: 1
  image:
    repository: tortoise/gateway
    tag: "0.1.0"
  service:
    type: ClusterIP
    port: 8080

# Cloud specific
cloud:
  replicas: 1
  image:
    repository: tortoise/cloud
    tag: "0.1.0"
  service:
    type: ClusterIP
    port: 8081
  env:
    JWT_SECRET: "change-me-in-production"
    DATABASE_URL: ""

# External services
externalServices:
  postgres:
    enabled: true
    host: ""
    port: 5432
    database: tortoise
    username: tortoise
    password: ""

  redis:
    enabled: true
    host: ""
    port: 6379
    password: ""

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tortoise.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
