# Tortoise Server Configuration

app:
  address: ":8080"
  secret_key: "your-secret-key-change-in-production"
  debug: false

database:
  type: "sqlite"
  path: "./data/tortoise.db"

# AI Providers
ai:
  providers:
    - name: "openai"
      base_url: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      models:
        - "gpt-4-turbo"
        - "gpt-4"
        - "gpt-3.5-turbo"
    
    - name: "anthropic"
      base_url: "https://api.anthropic.com"
      api_key: "${ANTHROPIC_API_KEY}"
      models:
        - "claude-3-opus-20240229"
        - "claude-3-sonnet-20240229"
        - "claude-3-haiku-20240207"

# Message Channels
channels:
  channels:
    - type: "telegram"
      token: "${TELEGRAM_BOT_TOKEN}"
      webhook: ""
    
    - type: "discord"
      token: "${DISCORD_BOT_TOKEN}"
      webhook: ""

# Plugins
plugins:
  directory: "./plugins"
  registry: "https://plugins.tortoise.ai"
