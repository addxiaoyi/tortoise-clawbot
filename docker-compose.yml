version: '3.8'

services:
  # Tortoise Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tortoise-server
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    volumes:
      - tortoise-data:/app/data
      - tortoise-plugins:/app/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tortoise-network

  # Redis (可选 - 用于缓存)
  redis:
    image: redis:7-alpine
    container_name: tortoise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - tortoise-network

volumes:
  tortoise-data:
  tortoise-plugins:
  redis-data:

networks:
  tortoise-network:
    driver: bridge
